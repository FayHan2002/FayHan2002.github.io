<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<meta name="description" content="糖尿病知识助手 — 药物、饮食、运动知识，血糖记录，用药提醒">
<title>糖尿病知识助手</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --green: #4A8C6F;
  --green-light: rgba(74,140,111,0.12);
  --green-glow: rgba(74,140,111,0.06);
  --bg: #F5EFE6;
  --card: #FFF8F0;
  --brown: #8B6F47;
  --brown-light: rgba(139,111,71,0.12);
  --text: #3D3D3D;
  --text-light: #666666;
  --text-muted: #999999;
  --border: rgba(139,111,71,0.15);
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 12px;
  --radius-sm: 8px;
  --font-size-base: 16px;
  --font-size-lg: 18px;
  --font-size-xl: 22px;
  --font-size-2xl: 28px;
  --touch-target: 44px;
  --nav-height: 64px;
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: var(--font-size-base); -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  max-width: 100vw;
  overflow-x: hidden;
  padding-bottom: calc(var(--nav-height) + 20px);
  -webkit-font-smoothing: antialiased;
}

h1 { font-size: var(--font-size-2xl); font-weight: 700; }
h2 { font-size: var(--font-size-xl); font-weight: 600; }
h3 { font-size: var(--font-size-lg); font-weight: 600; }
a { color: var(--green); text-decoration: none; }

/* ===== Page Container ===== */
.page { display: none; padding: 20px 16px; }
.page.active { display: block; }

/* ===== Bottom Navigation ===== */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
  display: flex; justify-content: space-around; align-items: center;
  height: var(--nav-height);
  background: rgba(255,248,240,0.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  box-shadow: 0 -2px 12px rgba(0,0,0,0.04);
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-size: 0.7rem; color: var(--text-muted);
  min-width: var(--touch-target); min-height: var(--touch-target);
  justify-content: center;
  background: none; border: none; cursor: pointer;
  transition: color 0.2s;
}
.nav-item.active { color: var(--green); font-weight: 600; }
.nav-icon { font-size: 1.3rem; }

/* ===== Search Bar ===== */
.search-wrap {
  position: relative; margin-bottom: 20px;
}
.search-input {
  width: 100%; padding: 12px 16px 12px 42px;
  border: 1.5px solid var(--border);
  border-radius: calc(var(--radius) * 2);
  background: var(--card);
  font-size: var(--font-size-base);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.search-input::placeholder { color: var(--text-muted); }
.search-input:focus { border-color: var(--green); }
.search-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  font-size: 1.1rem; color: var(--text-muted); pointer-events: none;
}

/* ===== Category Cards (Home) ===== */
.cat-cards {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
  margin-bottom: 24px;
}
.cat-card {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 20px 8px; border-radius: var(--radius);
  border: 1.5px solid var(--border);
  background: var(--card);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  font-size: var(--font-size-base); font-weight: 600;
}
.cat-card:active { transform: scale(0.96); }
.cat-card .cat-icon { font-size: 2rem; }

/* ===== Article Card ===== */
.article-card {
  padding: 16px; margin-bottom: 12px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--card);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: border-color 0.2s;
}
.article-card:active { border-color: var(--green); }
.article-title { font-size: var(--font-size-lg); font-weight: 600; margin-bottom: 6px; }
.article-source { font-size: 0.8rem; color: var(--brown); margin-bottom: 6px; }
.article-summary { font-size: var(--font-size-base); color: var(--text-light); line-height: 1.6; margin-bottom: 8px; }
.article-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  font-size: 0.75rem; padding: 2px 10px;
  border-radius: 20px; background: var(--green-light);
  color: var(--green);
}
.article-full { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-size: var(--font-size-base); color: var(--text); line-height: 1.8; white-space: pre-line; }
.article-full.open { display: block; }

/* ===== Tabs ===== */
.tabs {
  display: flex; gap: 8px; margin-bottom: 16px;
}
.tab {
  flex: 1; padding: 10px; text-align: center; border-radius: 24px;
  font-size: var(--font-size-base); font-weight: 500;
  border: 1.5px solid var(--border);
  background: var(--card);
  cursor: pointer;
  transition: all 0.2s;
}
.tab.active { background: var(--green); color: #FFF; border-color: var(--green); }

/* ===== FAQ ===== */
.faq-list { margin-bottom: 24px; }
.faq-item {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--card);
  margin-bottom: 8px;
  overflow: hidden;
}
.faq-q {
  padding: 14px 16px; font-size: var(--font-size-base); font-weight: 500;
  cursor: pointer; display: flex; justify-content: space-between; align-items: center;
}
.faq-q::after { content: '▸'; font-size: 0.8rem; color: var(--text-muted); transition: transform 0.2s; }
.faq-item.open .faq-q::after { transform: rotate(90deg); }
.faq-a {
  display: none; padding: 0 16px 14px; font-size: var(--font-size-base);
  color: var(--text-light); line-height: 1.7;
}
.faq-item.open .faq-a { display: block; }

/* ===== Section Header ===== */
.section-header {
  font-size: var(--font-size-xl); font-weight: 700;
  margin-bottom: 16px; margin-top: 8px;
  display: flex; align-items: center; gap: 8px;
}

/* ===== Hero ===== */
.hero {
  text-align: center; padding: 16px 0 20px;
}
.hero h1 { margin-bottom: 6px; }
.hero p { color: var(--text-light); font-size: var(--font-size-base); }

/* ===== Blood Sugar ===== */
.bs-stats {
  display: flex; gap: 10px; margin-bottom: 16px;
}
.bs-stat {
  flex: 1; text-align: center; padding: 12px 8px;
  border-radius: var(--radius-sm); background: var(--green-light);
}
.bs-stat .bs-val { font-size: var(--font-size-xl); font-weight: 700; color: var(--green); }
.bs-stat .bs-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
.bs-record {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 14px; margin-bottom: 6px;
  border-radius: var(--radius-sm); background: var(--card);
  border: 1px solid var(--border);
}
.bs-record .bs-type { font-size: 0.85rem; color: var(--text-light); }
.bs-record .bs-value { font-weight: 700; }
.bs-record .bs-time { font-size: 0.75rem; color: var(--text-muted); }
.bs-high { color: #D4744A; }
.bs-normal { color: var(--green); }
.bs-low { color: #D4A54A; }

/* ===== Add Record Form ===== */
.form-row {
  display: flex; gap: 8px; margin-bottom: 12px;
}
.form-select, .form-input {
  padding: 10px 14px; border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); font-size: var(--font-size-base);
  background: var(--card); color: var(--text); outline: none;
}
.form-select { flex: 1; }
.form-input { width: 80px; text-align: center; }
.form-input:focus, .form-select:focus { border-color: var(--green); }

/* ===== Buttons ===== */
.btn {
  display: block; width: 100%; padding: 14px;
  border: none; border-radius: var(--radius);
  font-size: var(--font-size-lg); font-weight: 600;
  cursor: pointer; transition: opacity 0.2s, transform 0.1s;
  min-height: var(--touch-target);
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--green); color: #FFF; }
.btn-outline {
  background: transparent; color: var(--green);
  border: 1.5px solid var(--green);
}
.btn-danger { background: transparent; color: #D4744A; border: 1.5px solid #D4744A; }

/* ===== Medication Checklist ===== */
.med-item {
  display: flex; align-items: center; gap: 12px; padding: 14px;
  margin-bottom: 8px; border-radius: var(--radius-sm);
  background: var(--card); border: 1px solid var(--border);
}
.med-item input[type="checkbox"] {
  width: 22px; height: 22px; accent-color: var(--green); flex-shrink: 0;
}
.med-item .med-info { flex: 1; }
.med-item .med-name { font-weight: 600; }
.med-item .med-meta { font-size: 0.8rem; color: var(--text-muted); }
.med-item.done .med-name { text-decoration: line-through; color: var(--text-muted); }

/* ===== Platform Link Card ===== */
.link-card {
  display: flex; align-items: center; gap: 12px; padding: 14px;
  margin-bottom: 8px; border-radius: var(--radius-sm);
  background: var(--card); border: 1px solid var(--border);
  text-decoration: none; color: var(--text);
}
.link-card:active { border-color: var(--green); }
.link-platform {
  font-size: 1.5rem; width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; background: var(--green-light); flex-shrink: 0;
}
.link-info { flex: 1; }
.link-title { font-weight: 600; font-size: var(--font-size-base); }
.link-note { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

/* ===== Search Results ===== */
.search-results {
  position: absolute; top: 100%; left: 0; right: 0;
  background: var(--card); border-radius: var(--radius);
  box-shadow: 0 8px 30px rgba(0,0,0,0.12);
  z-index: 100; max-height: 60vh; overflow-y: auto; display: none;
}
.search-results.open { display: block; }
.search-result-item {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  cursor: pointer; display: block; color: var(--text); text-decoration: none;
}
.search-result-item:last-child { border-bottom: none; }
.search-result-item:active { background: var(--green-light); }
.search-result-item .sr-title { font-weight: 600; }
.search-result-item .sr-cat { font-size: 0.75rem; color: var(--green); margin-top: 2px; }

/* ===== Empty State ===== */
.empty {
  text-align: center; padding: 40px 20px; color: var(--text-muted);
}
.empty-icon { font-size: 3rem; margin-bottom: 12px; }

/* ===== Recently Added ===== */
.recent-list { margin-bottom: 24px; }
.recent-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 0;
  border-bottom: 1px solid var(--border); cursor: pointer;
}
.recent-item:last-child { border-bottom: none; }
.recent-item .ri-icon { font-size: 1.2rem; }
.recent-item .ri-title { flex: 1; font-size: var(--font-size-base); }
.recent-item .ri-date { font-size: 0.75rem; color: var(--text-muted); }

/* ===== Platform Group ===== */
.platform-group { margin-bottom: 16px; }
.platform-group-title {
  font-size: var(--font-size-base); font-weight: 600; color: var(--brown);
  margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}

/* ===== Screen Reader Only ===== */
.sr-only {
  position: absolute; width: 1px; height: 1px;
  overflow: hidden; clip: rect(0,0,0,0);
  white-space: nowrap; border: 0;
}

/* ===== Back link ===== */
.back-link {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: var(--font-size-base); color: var(--green);
  margin-bottom: 12px; cursor: pointer; background: none; border: none;
}
</style>
</head>
<body>

<!-- Home Page -->
<div class="page active" id="page-home">
  <div class="hero">
    <h1>糖尿病知识助手</h1>
    <p>药物 · 饮食 · 运动，科学控糖每一天</p>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchHome" placeholder="搜索你想了解的知识..." autocomplete="off">
    <div class="search-results" id="searchResultsHome"></div>
  </div>
  <div class="cat-cards" id="catCards"></div>
  <h2 class="section-header">📌 常见问题</h2>
  <div class="faq-list" id="faqList"></div>
  <h2 class="section-header">🆕 最近添加</h2>
  <div class="recent-list" id="recentList"></div>
</div>

<!-- Medication Page -->
<div class="page" id="page-medication">
  <h2 class="section-header">💊 药物知识</h2>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchMedication" placeholder="搜索药物知识..." autocomplete="off">
    <div class="search-results" id="searchResultsMedication"></div>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="book" data-category="medication">📚 基础知识</button>
    <button class="tab" data-tab="platform" data-category="medication">🔗 平台帖子</button>
  </div>
  <div id="medicationList"></div>
</div>

<!-- Diet Page -->
<div class="page" id="page-diet">
  <h2 class="section-header">🥗 饮食指导</h2>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchDiet" placeholder="搜索饮食知识..." autocomplete="off">
    <div class="search-results" id="searchResultsDiet"></div>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="book" data-category="diet">📚 基础知识</button>
    <button class="tab" data-tab="platform" data-category="diet">🔗 平台帖子</button>
  </div>
  <div id="dietList"></div>
</div>

<!-- Exercise Page -->
<div class="page" id="page-exercise">
  <h2 class="section-header">🏃 运动建议</h2>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchExercise" placeholder="搜索运动知识..." autocomplete="off">
    <div class="search-results" id="searchResultsExercise"></div>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="book" data-category="exercise">📚 基础知识</button>
    <button class="tab" data-tab="platform" data-category="exercise">🔗 平台帖子</button>
  </div>
  <div id="exerciseList"></div>
</div>

<!-- Tools Page -->
<div class="page" id="page-tools">
  <h2 class="section-header">🩸 今日血糖</h2>
  <div class="bs-stats" id="bsStats"></div>
  <div id="bsRecords"></div>
  <button class="btn btn-outline" id="btnAddRecord" style="margin-bottom:24px">+ 记录血糖</button>
  <div id="addRecordForm" style="display:none;margin-bottom:20px;">
    <div class="form-row">
      <label for="recordType" class="sr-only">测量类型</label>
      <select class="form-select" id="recordType">
        <option value="fasting">空腹</option>
        <option value="after-breakfast">早餐后2h</option>
        <option value="after-lunch">午餐后2h</option>
        <option value="after-dinner">晚餐后2h</option>
        <option value="bedtime">睡前</option>
      </select>
      <label for="recordValue" class="sr-only">血糖值 (mmol/L)</label>
      <input class="form-input" id="recordValue" type="number" step="0.1" placeholder="mmol/L" min="1" max="30">
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" id="btnSaveRecord" style="flex:1">保存记录</button>
      <button class="btn btn-outline" id="btnCancelRecord" style="flex:1">取消</button>
    </div>
  </div>

  <h2 class="section-header">💊 今日用药</h2>
  <div id="medChecklist"></div>
  <button class="btn btn-outline" id="btnEditMeds" style="margin-bottom:8px">编辑用药清单</button>
  <div id="editMedsForm" style="display:none;margin-bottom:20px;"></div>

  <h2 class="section-header">🔗 各平台精选</h2>
  <div id="platformLinks"></div>
</div>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
  <button class="nav-item active" data-page="home"><span class="nav-icon">🏠</span>首页</button>
  <button class="nav-item" data-page="medication"><span class="nav-icon">💊</span>药物</button>
  <button class="nav-item" data-page="diet"><span class="nav-icon">🥗</span>饮食</button>
  <button class="nav-item" data-page="exercise"><span class="nav-icon">🏃</span>运动</button>
  <button class="nav-item" data-page="tools"><span class="nav-icon">🔧</span>工具</button>
</nav>

<script>
/* ===== State ===== */
let articles = [];
let links = [];
let faqs = [];
let currentPage = 'home';

/* ===== Routing ===== */
function navigateTo(page) {
  currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const target = document.getElementById('page-' + page);
  if (target) target.classList.add('active');

  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.page === page);
  });

  if (page === 'home') renderHome();
  else if (page === 'medication') renderCategoryPage('medication', 'book');
  else if (page === 'diet') renderCategoryPage('diet', 'book');
  else if (page === 'exercise') renderCategoryPage('exercise', 'book');
  else if (page === 'tools') renderTools();

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ===== Bottom Nav ===== */
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => navigateTo(btn.dataset.page));
});

/* ===== Data Loading ===== */
async function loadData() {
  try {
    const [a, l, f] = await Promise.all([
      fetch('data/articles.json').then(r => r.json()),
      fetch('data/links.json').then(r => r.json()),
      fetch('data/faq.json').then(r => r.json())
    ]);
    articles = a;
    links = l;
    faqs = f;
  } catch (e) {
    console.error('Failed to load data:', e);
  }
}

/* ===== localStorage Helpers ===== */
function getBloodSugarRecords() {
  try { return JSON.parse(localStorage.getItem('bs_records') || '[]'); }
  catch { return []; }
}
function saveBloodSugarRecords(records) {
  localStorage.setItem('bs_records', JSON.stringify(records));
}

function getMedications() {
  try { return JSON.parse(localStorage.getItem('medications') || '[]'); }
  catch { return []; }
}
function saveMedications(meds) {
  localStorage.setItem('medications', JSON.stringify(meds));
}

function getMedChecks() {
  try { return JSON.parse(localStorage.getItem('med_checks') || '{}'); }
  catch { return {}; }
}
function saveMedChecks(checks) {
  localStorage.setItem('med_checks', JSON.stringify(checks));
}

// Reset medication checks if it's a new day
function checkDayReset() {
  const today = new Date().toISOString().slice(0, 10);
  const lastDate = localStorage.getItem('med_check_date');
  if (lastDate !== today) {
    localStorage.setItem('med_check_date', today);
    localStorage.setItem('med_checks', '{}');
  }
}

/* ===== Initialize ===== */
async function init() {
  checkDayReset();
  await loadData();
  renderHome();
}
init();

/* ===== Home Page ===== */
function renderHome() {
  renderCatCards();
  renderFAQ();
  renderRecent();
  // Reset search
  document.getElementById('searchHome').value = '';
  document.getElementById('searchResultsHome').classList.remove('open');
}

function renderCatCards() {
  document.getElementById('catCards').innerHTML = `
    <div class="cat-card" onclick="navigateTo('medication')">
      <span class="cat-icon">💊</span>药物
    </div>
    <div class="cat-card" onclick="navigateTo('diet')">
      <span class="cat-icon">🥗</span>饮食
    </div>
    <div class="cat-card" onclick="navigateTo('exercise')">
      <span class="cat-icon">🏃</span>运动
    </div>`;
}

function renderFAQ() {
  const topFaqs = faqs.slice(0, 5);
  document.getElementById('faqList').innerHTML = topFaqs.map((faq, i) => `
    <div class="faq-item" id="faq-${i}">
      <div class="faq-q" onclick="toggleFAQ(${i})">${faq.q}</div>
      <div class="faq-a">${faq.a}</div>
    </div>`).join('');
}

function toggleFAQ(i) {
  document.getElementById('faq-' + i).classList.toggle('open');
}

function renderRecent() {
  const sorted = [...articles].sort((a, b) => b.date.localeCompare(a.date));
  const recent = sorted.slice(0, 3);
  document.getElementById('recentList').innerHTML = recent.length === 0
    ? '<div class="empty"><div class="empty-icon">📭</div>暂无文章</div>'
    : recent.map(a => `
      <div class="recent-item" onclick="openArticle('${a.category}', ${a.id})">
        <span class="ri-icon">${a.sourceType === 'book' ? '📚' : '🔗'}</span>
        <span class="ri-title">${a.title}</span>
        <span class="ri-date">${a.date}</span>
      </div>`).join('');
}

function openArticle(category, id) {
  navigateTo(category);
  setTimeout(() => {
    const card = document.getElementById('article-' + id);
    if (card) {
      card.scrollIntoView({ behavior: 'smooth' });
      card.querySelector('.article-full').classList.add('open');
    }
  }, 100);
}
/* ===== Category Pages ===== */
let currentTab = { medication: 'book', diet: 'book', exercise: 'book' };

function renderCategoryPage(category, tab) {
  currentTab[category] = tab || currentTab[category];
  const tabBtns = document.querySelectorAll(`#page-${category} .tab`);
  tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === currentTab[category]));

  const listEl = document.getElementById(category + 'List');
  const filtered = articles.filter(a => {
    if (a.category !== category) return false;
    if (currentTab[category] === 'book') return a.sourceType === 'book';
    return a.sourceType === 'platform' || links.some(l => l.category === category);
  });

  if (currentTab[category] === 'book') {
    listEl.innerHTML = filtered.length === 0
      ? '<div class="empty"><div class="empty-icon">📭</div>暂无基础知识文章</div>'
      : filtered.map(a => renderArticleCard(a)).join('');
  } else {
    const catLinks = links.filter(l => l.category === category);
    const platformArticles = articles.filter(a => a.category === category && a.sourceType === 'platform');
    const linkItems = catLinks.map(renderLinkCard).join('');
    const artItems = platformArticles.map(a => renderArticleCard(a)).join('');
    listEl.innerHTML = (artItems + linkItems) || '<div class="empty"><div class="empty-icon">📭</div>暂无平台帖子链接</div>';
  }
}

function renderArticleCard(a) {
  return `
    <div class="article-card" id="article-${a.id}">
      <div class="article-title">${a.title}</div>
      <div class="article-source">${a.sourceType === 'book' ? '📚' : '🔗'} 来源：${a.source}</div>
      <div class="article-summary">${a.summary}</div>
      <div class="article-tags">${(a.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}</div>
      ${a.content ? `<div class="article-full">${a.content}</div>` : ''}
      ${a.url ? `<a href="${a.url}" target="_blank" rel="noopener noreferrer" class="btn btn-outline" style="margin-top:8px;display:inline-block;width:auto;padding:8px 20px;">查看原文 →</a>` : ''}
    </div>`;
}

document.addEventListener('click', function(e) {
  const card = e.target.closest('.article-card');
  if (card) {
    const full = card.querySelector('.article-full');
    const btn = card.querySelector('.btn-outline');
    if (full && !e.target.closest('.btn-outline')) {
      full.classList.toggle('open');
    }
  }
});

/* ===== Tab Switching ===== */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', function() {
    const category = this.dataset.category;
    const tabType = this.dataset.tab;
    renderCategoryPage(category, tabType);
  });
});

function renderLinkCard(l) {
  return `<a href="${l.url}" target="_blank" rel="noopener noreferrer" class="article-card" style="display:block;text-decoration:none;color:var(--text);">
    <div class="article-title">${l.title}</div>
    <div class="article-source">🔗 ${l.platform} · ${(l.tags || []).join(' · ')}</div>
    <div class="article-summary">${l.note || ''}</div>
  </a>`;
}

/* ===== Tools Page ===== */
function renderTools() {
  renderBloodSugar();
  renderMedChecklist();
  renderPlatformLinks();
}

/* ===== Blood Sugar Tracker ===== */
function renderBloodSugar() {
  const records = getBloodSugarRecords();
  const today = new Date().toISOString().slice(0, 10);
  const todayRecords = records.filter(r => r.date === today).sort((a, b) => a.time.localeCompare(b.time));

  // Stats
  if (todayRecords.length > 0) {
    const vals = todayRecords.map(r => r.value);
    const min = Math.min(...vals);
    const max = Math.max(...vals);
    const avg = (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1);
    document.getElementById('bsStats').innerHTML = `
      <div class="bs-stat"><div class="bs-val">${min}</div><div class="bs-label">最低</div></div>
      <div class="bs-stat"><div class="bs-val">${max}</div><div class="bs-label">最高</div></div>
      <div class="bs-stat"><div class="bs-val">${avg}</div><div class="bs-label">平均</div></div>`;
  } else {
    document.getElementById('bsStats').innerHTML = '<div class="empty" style="padding:12px;width:100%">今日暂无记录</div>';
  }

  // Records list
  const typeNames = { fasting: '空腹', 'after-breakfast': '早餐后2h', 'after-lunch': '午餐后2h', 'after-dinner': '晚餐后2h', bedtime: '睡前' };
  document.getElementById('bsRecords').innerHTML = todayRecords.length === 0
    ? '<div class="empty"><div class="empty-icon">📋</div>点击下方按钮记录血糖</div>'
    : todayRecords.map(r => {
        let cls = 'bs-normal';
        if (r.type === 'fasting' && (r.value < 4.4 || r.value > 7.0)) cls = r.value < 4.4 ? 'bs-low' : 'bs-high';
        else if (r.type !== 'fasting' && (r.value < 4.4 || r.value > 10.0)) cls = r.value < 4.4 ? 'bs-low' : 'bs-high';
        return `<div class="bs-record">
          <span class="bs-type">${typeNames[r.type] || r.type}</span>
          <span class="bs-value ${cls}">${r.value} mmol/L</span>
          <span class="bs-time">${r.time}</span>
        </div>`;
      }).join('');

  document.getElementById('addRecordForm').style.display = 'none';
}

document.getElementById('btnAddRecord').addEventListener('click', function() {
  document.getElementById('addRecordForm').style.display = 'block';
  document.getElementById('recordValue').value = '';
  document.getElementById('recordValue').focus();
});

document.getElementById('btnCancelRecord').addEventListener('click', function() {
  document.getElementById('addRecordForm').style.display = 'none';
});

document.getElementById('btnSaveRecord').addEventListener('click', function() {
  const type = document.getElementById('recordType').value;
  const value = parseFloat(document.getElementById('recordValue').value);
  if (isNaN(value) || value < 1 || value > 30) {
    alert('请输入有效的血糖值（1-30 mmol/L）');
    return;
  }
  const now = new Date();
  const record = {
    date: now.toISOString().slice(0, 10),
    time: now.toTimeString().slice(0, 5),
    type: type,
    value: value
  };
  const records = getBloodSugarRecords();
  records.push(record);
  saveBloodSugarRecords(records);
  renderBloodSugar();
});

/* ===== Medication Checklist ===== */
function renderMedChecklist() {
  const meds = getMedications();
  const checks = getMedChecks();
  const container = document.getElementById('medChecklist');

  if (meds.length === 0) {
    container.innerHTML = `
      <div class="empty" style="padding:16px">
        <div class="empty-icon">💊</div>
        <p>还没有添加用药</p>
        <p style="font-size:0.85rem">点击下方按钮添加每日用药清单</p>
      </div>`;
  } else {
    container.innerHTML = meds.map(m => {
      const checked = checks[m.id] || false;
      return `<div class="med-item ${checked ? 'done' : ''}" onclick="toggleMedCheck(${m.id})">
        <input type="checkbox" ${checked ? 'checked' : ''} id="med-cb-${m.id}">
        <div class="med-info">
          <div class="med-name">${m.name} ${m.dosage}</div>
          <div class="med-meta">${m.timing === 'after-breakfast' ? '早饭后' : m.timing === 'after-lunch' ? '午饭后' : m.timing === 'after-dinner' ? '晚饭后' : '睡前'}</div>
        </div>
      </div>`;
    }).join('');
  }
}

function toggleMedCheck(id) {
  const checks = getMedChecks();
  checks[id] = !checks[id];
  saveMedChecks(checks);
  renderMedChecklist();
}

document.getElementById('btnEditMeds').addEventListener('click', function() {
  const formEl = document.getElementById('editMedsForm');
  if (formEl.style.display === 'block') {
    formEl.style.display = 'none';
    return;
  }
  const meds = getMedications();
  formEl.style.display = 'block';
  formEl.innerHTML = `
    <div style="margin-bottom:12px">
      ${meds.map((m, i) => `
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
          <span style="flex:1;font-size:0.9rem">${m.name} ${m.dosage} — ${m.timing}</span>
          <button class="btn btn-danger" style="width:auto;padding:6px 12px;font-size:0.8rem;min-height:auto" onclick="removeMed(${i})">删除</button>
        </div>`).join('')}
    </div>
    <div class="form-row">
      <input class="form-input" id="newMedName" placeholder="药名" style="flex:1;width:auto">
      <input class="form-input" id="newMedDosage" placeholder="剂量" style="width:100px">
    </div>
    <div class="form-row">
      <select class="form-select" id="newMedTiming">
        <option value="after-breakfast">早饭后</option>
        <option value="after-lunch">午饭后</option>
        <option value="after-dinner">晚饭后</option>
        <option value="bedtime">睡前</option>
      </select>
    </div>
    <button class="btn btn-primary" id="btnAddMed">添加药物</button>`;

  document.getElementById('btnAddMed').addEventListener('click', function() {
    const name = document.getElementById('newMedName').value.trim();
    const dosage = document.getElementById('newMedDosage').value.trim();
    const timing = document.getElementById('newMedTiming').value;
    if (!name) { alert('请输入药物名称'); return; }
    const meds = getMedications();
    meds.push({ id: Date.now(), name, dosage, timing });
    saveMedications(meds);
    renderMedChecklist();
    document.getElementById('editMedsForm').style.display = 'none';
  });
});

function removeMed(index) {
  const meds = getMedications();
  meds.splice(index, 1);
  saveMedications(meds);
  renderMedChecklist();
  document.getElementById('editMedsForm').style.display = 'none';
}

/* ===== Platform Links ===== */
function renderPlatformLinks() {
  const container = document.getElementById('platformLinks');
  const platforms = [
    { key: 'wechat', name: '微信公众号', icon: '📱' },
    { key: 'zhihu', name: '知乎', icon: '📘' },
    { key: 'xiaohongshu', name: '小红书', icon: '📕' },
    { key: 'bilibili', name: 'B站', icon: '🎬' },
    { key: 'douyin', name: '抖音', icon: '🎵' }
  ];

  container.innerHTML = platforms.map(p => {
    const plinks = links.filter(l => l.platform === p.key);
    if (plinks.length === 0) return '';
    return `<div class="platform-group">
      <div class="platform-group-title"><span>${p.icon}</span> ${p.name}</div>
      ${plinks.map(l => `
        <a href="${l.url}" target="_blank" rel="noopener noreferrer" class="link-card">
          <div class="link-info">
            <div class="link-title">${l.title}</div>
            <div class="link-note">${l.note || ''} · ${(l.tags || []).join(' · ')}</div>
          </div>
          <span style="color:var(--text-muted)">→</span>
        </a>`).join('')}
    </div>`;
  }).join('');
}

/* ===== Search ===== */
function search(query) {
  if (!query || query.trim().length < 1) return [];
  const q = query.trim().toLowerCase();
  const results = [];

  // Search articles
  articles.forEach(a => {
    if (a.title.toLowerCase().includes(q) ||
        (a.summary && a.summary.toLowerCase().includes(q)) ||
        (a.tags || []).some(t => t.toLowerCase().includes(q))) {
      results.push({ type: 'article', title: a.title, category: a.category, id: a.id, tags: a.tags });
    }
  });

  // Search FAQ
  faqs.forEach((f, i) => {
    if (f.q.toLowerCase().includes(q) || f.a.toLowerCase().includes(q)) {
      results.push({ type: 'faq', title: f.q, category: f.category, id: i });
    }
  });

  return results;
}

function showSearchResults(inputEl, resultsEl, isHome) {
  const query = inputEl.value.trim();
  if (!query) { resultsEl.classList.remove('open'); return; }
  const results = search(query);
  if (results.length === 0) {
    resultsEl.innerHTML = '<div class="search-result-item" style="color:var(--text-muted)">未找到相关内容</div>';
  } else {
    const catNames = { medication: '💊 药物', diet: '🥗 饮食', exercise: '🏃 运动' };
    resultsEl.innerHTML = results.slice(0, 10).map(r => {
      if (r.type === 'faq') {
        return `<div class="search-result-item" onclick="navigateToFaq('${r.category}', ${r.id})">
          <div class="sr-title">${r.title}</div>
          <div class="sr-cat">📌 常见问题 · ${catNames[r.category] || r.category}</div>
        </div>`;
      }
      return `<div class="search-result-item" onclick="navigateToArticle('${r.category}', ${r.id})">
        <div class="sr-title">${r.title}</div>
        <div class="sr-cat">${catNames[r.category] || r.category}</div>
      </div>`;
    }).join('');
  }
  resultsEl.classList.add('open');
}

function navigateToFaq(category, faqIndex) {
  navigateTo('home');
  setTimeout(() => {
    document.getElementById('searchHome').value = faqs[faqIndex] ? faqs[faqIndex].q : '';
    const faqEl = document.getElementById('faq-' + faqIndex);
    if (faqEl) {
      faqEl.scrollIntoView({ behavior: 'smooth' });
      faqEl.classList.add('open');
    }
  }, 100);
  document.querySelectorAll('.search-results').forEach(el => el.classList.remove('open'));
}

function navigateToArticle(category, id) {
  navigateTo(category);
  setTimeout(() => {
    const card = document.getElementById('article-' + id);
    if (card) {
      card.scrollIntoView({ behavior: 'smooth' });
      const full = card.querySelector('.article-full');
      if (full) full.classList.add('open');
    }
  }, 100);
  document.querySelectorAll('.search-results').forEach(el => el.classList.remove('open'));
}

// Wire up search inputs
function setupSearch(inputId, resultsId, isHome) {
  const input = document.getElementById(inputId);
  const results = document.getElementById(resultsId);
  let debounceTimer;
  input.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => showSearchResults(input, results, isHome), 200);
  });
  input.addEventListener('focus', function() {
    if (input.value.trim()) showSearchResults(input, results, isHome);
  });
  // Close search on outside click
  document.addEventListener('click', function(e) {
    if (!input.contains(e.target) && !results.contains(e.target)) {
      results.classList.remove('open');
    }
  });
}

setupSearch('searchHome', 'searchResultsHome', true);
setupSearch('searchMedication', 'searchResultsMedication', false);
setupSearch('searchDiet', 'searchResultsDiet', false);
setupSearch('searchExercise', 'searchResultsExercise', false);

</script>
