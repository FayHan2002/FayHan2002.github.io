<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="韩馥伊 Han Fuyi — 语言病理学研究者，专注言语感知神经机制(EEG)与认知神经科学。">
<meta property="og:title" content="Han Fuyi / 韩馥伊">
<meta property="og:description" content="语言病理学 · 认知神经科学 · 言语感知(EEG)">
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_CN">
<meta name="twitter:card" content="summary">
<link rel="alternate" hreflang="zh" href="https://fayhan2002.github.io/">
<link rel="alternate" hreflang="en" href="https://fayhan2002.github.io/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Source+Sans+Pro:ital,wght@0,200;0,300;0,400;1,300&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<title>Han Fuyi / 韩馥伊</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
<style>
/* ===== CSS Variables ===== */
:root {
  --beach: #0C0F13;
  --beach-deep: #090C10;
  --bg: #0E1117;
  --bg-deep: #0A0D12;
  --bg-surface: #11151D;
  --bg-card: #151A24;
  --bg-card-hover: #1A202C;
  --border: #1C2330;
  --border-light: #232B3A;
  --text: #DCD8D2;
  --text-light: #A8A49E;
  --text-muted: #6E6A64;
  --text-dim: #484540;
  --accent-ice: #88CCD6;
  --accent-ice-glow: rgba(136,204,214,0.12);
  --accent-warm: #D4A574;
  --accent-warm-glow: rgba(212,165,116,0.10);
  --foam-white: #E4E8ED;
  --water-clear: #8EC4CE;
  --water-deep: #163038;
  --shadow: 0 2px 16px rgba(0,0,0,0.35);
  --shadow-hover: 0 8px 36px rgba(0,0,0,0.5);
  --font-zh: 'Noto Serif SC', serif;
  --font-en-heading: 'Playfair Display', serif;
  --font-en-body: 'Source Sans Pro', sans-serif;
  --font-decorative: 'Cormorant Garamond', serif;
  --max-width: 900px;
  --section-gap: 100px;
  --line-height: 1.9;
  --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 17px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: var(--font-en-body); font-weight: 300;
  line-height: var(--line-height); color: var(--text);
  background-color: var(--bg);
  overflow-x: hidden; transition: opacity 0.25s ease;
}
body.fade-out { opacity: 0; }

/* Film grain overlay - stronger, more visible */
body::after {
  content: ''; position: fixed; inset: 0; z-index: 10000; pointer-events: none;
  opacity: 0.055;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)'/%3E%3C/svg%3E");
  background-size: 256px 256px;
}

h1, h2, h3, h4 { font-weight: 400; line-height: 1.3; }
h2 { font-family: var(--font-en-heading); font-size: 1.8rem; color: var(--text); }
h3 { font-family: var(--font-en-heading); font-size: 1.1rem; }
a { color: var(--accent-ice); text-decoration: none; transition: color var(--transition); }
a:hover { color: var(--accent-warm); }
a:focus-visible { outline: 2px solid var(--accent-ice); outline-offset: 3px; border-radius: 2px; }
img { max-width: 100%; height: auto; display: block; }
::selection { background: rgba(136,204,214,0.22); color: var(--foam-white); }

/* ===== Utility ===== */
.container { max-width: var(--max-width); margin: 0 auto; padding: 0 30px; }
.section-label {
  display: flex; align-items: center; gap: 16px; margin-bottom: 52px;
}
.section-label::before {
  content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent-ice); flex-shrink: 0;
}
.section-label::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--border), transparent);
}
.section-label span {
  font-family: var(--font-en-heading); font-size: 1.8rem; font-weight: 500;
  color: var(--text); flex-shrink: 0;
}
.section-label span.zh-label {
  font-family: var(--font-zh); font-size: 1.4rem; font-weight: 400;
}

/* ===== Navigation ===== */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  height: 56px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 34px; transition: background 0.5s ease, box-shadow 0.5s ease;
}
.nav.scrolled {
  background: rgba(13,17,23,0.82);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 1px 0 rgba(255,255,255,0.04);
}
.nav-links { display: flex; align-items: center; gap: 28px; list-style: none; }
.nav-links a {
  font-size: 0.78rem; font-weight: 400; color: var(--text-light);
  text-transform: uppercase; letter-spacing: 0.1em; position: relative;
  transition: color var(--transition);
}
.nav-links a::after {
  content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%) scaleX(0);
  width: 100%; height: 1.5px; background: var(--accent-ice);
  transition: transform var(--transition);
}
.nav-links a:hover, .nav-links a.active { color: var(--accent-ice); }
.nav-links a:hover::after, .nav-links a.active::after { transform: translateX(-50%) scaleX(1); }
.nav-actions { display: flex; align-items: center; gap: 10px; }

.lang-btn, .track-btn {
  font-family: var(--font-en-body); font-size: 0.74rem;
  border: 1px solid var(--border); background: transparent;
  color: var(--text-light); padding: 5px 15px; border-radius: 20px;
  cursor: pointer; transition: all var(--transition); white-space: nowrap;
}
.lang-btn:hover, .track-btn:hover { border-color: var(--accent-ice); color: var(--accent-ice); }
.track-btn.active {
  background: var(--accent-ice); color: var(--bg-deep); border-color: var(--accent-ice);
}

.hamburger {
  display: none; flex-direction: column; gap: 5px;
  background: none; border: none; cursor: pointer; padding: 8px; z-index: 1001;
}
.hamburger span {
  display: block; width: 22px; height: 1.5px; background: var(--text-light);
  transition: transform var(--transition), opacity var(--transition);
}
.hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(4.5px, 4.5px); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(4.5px, -4.5px); }

/* ===== Hero: Aerial Black Sand Beach ===== */
.hero {
  position: relative; min-height: 110vh;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  text-align: center; overflow: hidden; padding: 140px 30px 0;
  /* Base: pure black sand, matte */
  background: #0A0D10;
}

/* Full-frame beach SVG */
.hero-beach {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
}
.hero-beach svg { width: 100%; height: 100%; display: block; }

/* Sand particles */
.sand-particle { animation: particle-flicker 5s ease-in-out infinite; }
.sand-particle:nth-child(odd) { animation-delay: 1.5s; animation-duration: 4s; }
.sand-particle:nth-child(3n) { animation-delay: 3s; animation-duration: 6s; }

/* Wet sand reflection band */
.wet-sand { animation: wet-shift 20s ease-in-out infinite; }

/* Ocean water body */
.ocean-water { animation: water-shift 25s ease-in-out infinite; }

/* Foam layers — pulsing like waves */
.foam-layer { transform-origin: center; }
.foam-a { animation: foam-surge 8s ease-in-out infinite; }
.foam-b { animation: foam-surge 7s ease-in-out 2s infinite; }
.foam-c { animation: foam-surge 9s ease-in-out 4s infinite; }
.foam-d { animation: foam-surge 6.5s ease-in-out 1s infinite; }

/* Water traces on sand — appearing and fading */
.water-trace { animation: trace-fade 10s ease-in-out infinite; }
.water-trace:nth-child(2) { animation-delay: 3s; animation-duration: 8s; }
.water-trace:nth-child(3) { animation-delay: 6s; animation-duration: 11s; }
.water-trace:nth-child(4) { animation-delay: 2s; animation-duration: 9s; }

.hero-content { position: relative; z-index: 2; padding-bottom: 60px; }

.hero-photo {
  width: 136px; height: 136px; border-radius: 50%; object-fit: cover;
  border: 1.5px solid rgba(136,204,214,0.2);
  box-shadow: 0 0 48px rgba(136,204,214,0.04), 0 10px 36px rgba(0,0,0,0.55);
  margin: 0 auto 40px; background: #0F1318;
}

.hero h1 {
  font-family: var(--font-zh); font-size: 3rem; font-weight: 300;
  color: var(--foam-white); letter-spacing: 0.08em; margin-bottom: 2px;
}
.hero .en-name {
  font-family: var(--font-decorative); font-size: 1.4rem; font-weight: 300;
  font-style: italic; color: var(--foam-white); letter-spacing: 0.16em; margin-bottom: 24px;
}
.hero .motto {
  font-family: var(--font-zh); font-weight: 200; font-size: 1rem;
  color: var(--text-light); letter-spacing: 0.45em; margin-bottom: 42px;
}
.hero-track-toggles { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.hero-track-toggles .track-btn { padding: 9px 26px; font-size: 0.84rem; }

.hero-scroll-hint {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  z-index: 2; animation: float 3s ease-in-out infinite;
}
.hero-scroll-hint svg { width: 20px; height: 20px; stroke: rgba(255,255,255,0.18); }

/* ===== Sections ===== */
section { padding: var(--section-gap) 0; position: relative; }
section:nth-child(odd) { background: var(--bg); }
section:nth-child(even) { background: var(--bg-deep); }

.reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease, transform 0.8s ease; }
.reveal.visible { opacity: 1; transform: translateY(0); }

/* ===== About ===== */
.about-body { max-width: 700px; margin: 0 auto; }
.about-body p {
  font-family: var(--font-zh); font-size: 0.98rem; color: var(--text-light); font-weight: 300;
}
.about-body p + p { margin-top: 1.3em; }

.hobbies-line {
  margin-top: 36px; padding-top: 30px;
  border-top: 1px solid var(--border);
  font-family: var(--font-decorative); font-style: italic; font-weight: 400;
  font-size: 0.95rem; color: var(--text-muted);
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 2px;
}
.hobbies-line .hobby {
  cursor: default; transition: all var(--transition); padding: 2px 1px;
}
.hobbies-line .hobby:hover { color: var(--accent-warm); transform: translateY(-2px); }
.hobbies-line .dot { color: var(--border); margin: 0 5px; }

/* ===== Education Timeline ===== */
.timeline { position: relative; padding-left: 36px; }
.timeline::before {
  content: ''; position: absolute; left: 0; top: 4px; bottom: 4px;
  width: 1px;
  background: linear-gradient(180deg, var(--accent-ice), var(--border), var(--border));
}
.timeline-item { position: relative; margin-bottom: 38px; }
.timeline-item:last-child { margin-bottom: 0; }
.timeline-item::before {
  content: ''; position: absolute; left: -40.5px; top: 8px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--accent-ice); border: 2px solid var(--bg);
}
.timeline-item .year {
  font-family: var(--font-decorative); font-size: 0.9rem; font-weight: 600;
  color: var(--accent-ice); letter-spacing: 0.05em; margin-bottom: 4px;
}
.timeline-item .school { font-weight: 400; font-size: 1.08rem; color: var(--text); }
.timeline-item .degree { font-size: 0.9rem; color: var(--text-light); margin-top: 3px; }
.timeline-item .extra { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }

/* ===== Cards ===== */
.cards-grid { display: grid; gap: 19px; }
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 4px; padding: 28px 30px;
  transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition), background var(--transition);
  position: relative; overflow: hidden;
}
.card::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent-ice), transparent);
  opacity: 0; transition: opacity var(--transition);
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-hover);
  border-color: var(--border-light);
  background: var(--bg-card-hover);
}
.card:hover::after { opacity: 1; }

.card h3 { margin-bottom: 8px; font-size: 1.05rem; color: var(--text); line-height: 1.45; font-weight: 500; }
.card .meta {
  font-size: 0.8rem; color: var(--accent-ice); font-weight: 400;
  letter-spacing: 0.04em; margin-bottom: 10px;
}
.card .desc { font-size: 0.88rem; color: var(--text-light); line-height: 1.7; font-weight: 300; }
.card .authors { font-size: 0.76rem; color: var(--text-muted); font-style: italic; margin-bottom: 6px; }

.card.academic-card { border-left: 2px solid var(--accent-ice); padding-left: 28px; }
.card.industry-card { border-left: 2px solid var(--accent-warm); padding-left: 28px; }

/* ===== Section visibility ===== */
.dynamic-section { transition: opacity 0.4s ease, max-height 0.4s ease; overflow: hidden; }
.dynamic-section.hidden { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; margin: 0; pointer-events: none; }

/* ===== Skills ===== */
.skills-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.skill-cat {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 4px; padding: 26px;
  transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
}
.skill-cat:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); border-color: var(--border-light); }
.skill-cat h4 {
  font-family: var(--font-decorative); font-size: 1rem; font-weight: 600;
  color: var(--accent-ice); margin-bottom: 14px; letter-spacing: 0.05em;
}
.skill-tags { display: flex; flex-wrap: wrap; gap: 7px; }
.skill-tag {
  font-size: 0.76rem; padding: 4px 13px; border-radius: 14px;
  background: rgba(126,200,208,0.08); color: var(--accent-ice);
  border: 1px solid rgba(126,200,208,0.12);
  transition: all var(--transition); cursor: default;
}
.skill-tag:hover { background: var(--accent-ice); color: var(--bg-deep); border-color: var(--accent-ice); }

/* ===== Contact ===== */
.contact-links { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; }
.contact-link {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 24px; border: 1px solid var(--border);
  border-radius: 30px; font-size: 0.88rem; color: var(--text-light);
  transition: all var(--transition); background: transparent;
}
.contact-link:hover { border-color: var(--accent-ice); color: var(--accent-ice); transform: translateY(-2px); box-shadow: var(--shadow); }
.contact-link svg { width: 18px; height: 18px; flex-shrink: 0; }

/* ===== Footer ===== */
footer {
  text-align: center; padding: 44px 30px;
  font-size: 0.76rem; color: var(--text-muted);
  border-top: 1px solid var(--border); background: var(--bg-deep);
}
footer a { color: var(--text-muted); }
footer a:hover { color: var(--accent-ice); }

/* ===== Back to Top ===== */
.back-to-top {
  position: fixed; bottom: 30px; right: 30px; z-index: 999;
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--bg-card); border: 1px solid var(--border);
  box-shadow: var(--shadow); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transform: translateY(12px); pointer-events: none;
  transition: opacity var(--transition), transform var(--transition), border-color var(--transition);
}
.back-to-top.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
.back-to-top:hover { border-color: var(--accent-ice); transform: translateY(-2px); }
.back-to-top svg { width: 16px; height: 16px; stroke: var(--text-light); }

/* ===== Mobile Menu ===== */
.mobile-menu {
  position: fixed; top: 0; right: 0; bottom: 0; width: 270px;
  background: var(--bg-surface); z-index: 999;
  box-shadow: -6px 0 32px rgba(0,0,0,0.5);
  transform: translateX(100%); transition: transform 0.4s ease;
  display: flex; flex-direction: column; padding: 80px 34px 34px;
}
.mobile-menu.open { transform: translateX(0); }
.mobile-menu a {
  display: block; padding: 13px 0; font-size: 0.95rem;
  color: var(--text); border-bottom: 1px solid var(--border);
}
.mobile-menu .mobile-actions { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 10px; }
.mobile-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 998;
  opacity: 0; pointer-events: none; transition: opacity var(--transition);
}
.mobile-overlay.open { opacity: 1; pointer-events: auto; }

/* ===== Animations ===== */
/* Particle subtle twinkle */
@keyframes particle-flicker {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 0.45; }
}
/* Wet sand reflection slowly shifts */
@keyframes wet-shift {
  0%, 100% { opacity: 0.55; }
  50% { opacity: 0.7; }
}
/* Ocean water gentle movement */
@keyframes water-shift {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(1.5%); }
}
/* Foam layers surging — translate + scale */
@keyframes foam-surge {
  0%   { transform: translateX(0) scaleX(1); opacity: 0.5; }
  50%  { transform: translateX(8px) scaleX(1.04); opacity: 0.75; }
  100% { transform: translateX(-4px) scaleX(0.97); opacity: 0.55; }
}
/* Water traces fading in/out */
@keyframes trace-fade {
  0%, 100% { opacity: 0; }
  30% { opacity: 0.35; }
  60% { opacity: 0.5; }
  85% { opacity: 0.1; }
}
@keyframes float {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-12px); }
}

/* ===== Responsive: 768px ===== */
@media (max-width: 768px) {
  :root { --section-gap: 64px; }
  html { font-size: 15px; }
  .nav-links { display: none; }
  .hamburger { display: flex; }
  .hero { min-height: 100vh; padding: 110px 20px 0; }
  .hero h1 { font-size: 2.4rem; }
  .hero .en-name { font-size: 1.15rem; }
  .hero-photo { width: 116px; height: 116px; }
  .hero-beach { /* full-frame */ }
  .container { padding: 0 22px; }
  .skills-grid { grid-template-columns: 1fr 1fr; }
  .card { padding: 22px 20px; }
  .timeline { padding-left: 28px; }
  .timeline-item::before { left: -32.5px; width: 8px; height: 8px; }
}

/* ===== Responsive: 480px ===== */
@media (max-width: 480px) {
  .hero h1 { font-size: 1.9rem; }
  .hero .en-name { font-size: 1rem; }
  .hero .motto { font-size: 0.88rem; letter-spacing: 0.25em; }
  .hero-photo { width: 104px; height: 104px; }
  .hero-track-toggles { gap: 8px; }
  .hero-track-toggles .track-btn { padding: 7px 18px; font-size: 0.78rem; }
  .hero-content { padding-bottom: 70px; }
  .skills-grid { grid-template-columns: 1fr; }
  .cards-grid { gap: 14px; }
  .section-label span { font-size: 1.4rem; }
  .section-label span.zh-label { font-size: 1.15rem; }
  .contact-links { flex-direction: column; align-items: center; }
  .hobbies-line { font-size: 0.85rem; }
}

/* ===== Print ===== */
@media print {
  .nav, .hero-beach, .hero-scroll-hint, .hero-track-toggles,
  .hamburger, .mobile-menu, .mobile-overlay, .back-to-top,
  .contact-link, footer, body::after { display: none !important; }
  body { background: #fff; color: #000; font-size: 11pt; }
  .hero { min-height: auto; padding: 20px 0; background: none; }
  .hero-photo { width: 90px; height: 90px; }
  .hero h1 { font-size: 1.4rem; color: #000; }
  .hero .en-name, .hero .motto { color: #555; }
  section { padding: 16px 0; break-inside: avoid; background: #fff !important; }
  .card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; background: #fff; }
  .card:hover, .card:hover::after { transform: none; opacity: 0; }
  .card h3, .card .desc, .card .meta { color: #000; }
  .reveal { opacity: 1; transform: none; }
  a { color: #000; }
  .timeline::before { background: #ccc; }
  .dynamic-section.hidden { opacity: 1; max-height: none; display: block; }
  .skill-tag { background: #eee; color: #333; border-color: #ddd; }
}

/* ===== Reduced Motion ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  html { scroll-behavior: auto; }
}
</style>
</head>
<body>

<!-- ===== Navigation ===== -->
<header class="nav" id="navbar">

/* ===== State ===== */
let currentLang = localStorage.getItem('lang') || 'zh';
let currentTrack = localStorage.getItem('track') || '';

/* ===== I18N Text Populator ===== */
function populateI18nText(lang) {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const path = el.getAttribute('data-i18n');
    const val = path.split('.').reduce((o, k) => o?.[k], I18N[lang]);
    if (val !== undefined && typeof val === 'string') {
      if (path === 'about.hobbies' || path === 'research.note') {
        el.innerHTML = val;
      } else {
        el.textContent = val;
      }
    }
  });
}

      <div class="school">${item.school}</div>
      <div class="degree">${item.degree}</div>
      ${item.extra ? `<div class="extra">${item.extra}</div>` : ''}

  ).join('');
}

/* ===== Language Switch ===== */
function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('lang', lang);
  document.body.classList.add('fade-out');
  setTimeout(() => {
    rerenderAll();
    document.getElementById('langToggle').textContent = lang === 'zh' ? 'EN' : '中文';
    document.getElementById('langToggle').setAttribute('aria-label', lang === 'zh' ? 'Switch to English' : '切换到中文');
    document.title = lang === 'zh' ? '韩馥伊 / Han Fuyi' : 'Han Fuyi / 韩馥伊';
    document.body.classList.remove('fade-out');
  }, 200);
}

  setLang(currentLang === 'zh' ? 'en' : 'zh');
});

/* ===== Track Mode ===== */
function setTrack(track) {
  if (currentTrack === track) { currentTrack = ''; localStorage.removeItem('track'); }
  else { currentTrack = track; localStorage.setItem('track', track); }
  applyTrackMode();
}

function applyTrackMode() {
  document.body.classList.remove('mode-academic', 'mode-industry');
  if (currentTrack === 'academic') document.body.classList.add('mode-academic');
  if (currentTrack === 'industry') document.body.classList.add('mode-industry');

  document.querySelectorAll('.track-btn[data-track]').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-track') === currentTrack);
  });

  renderProjects(currentLang, currentTrack);
  toggleInternship(currentTrack !== 'academic');
  if (currentTrack !== 'academic') renderInternship(currentLang);
  refreshRevealObservers();
}

document.querySelectorAll('.track-btn[data-track]').forEach(btn => {
  btn.addEventListener('click', () => setTrack(btn.getAttribute('data-track')));
});

/* ===== IntersectionObserver ===== */
let revealObserver;
function setupRevealObserver() {
  revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.target.classList.contains('reveal') && entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
}
function refreshRevealObservers() {
  if (revealObserver) revealObserver.disconnect();
  setupRevealObserver();
  document.querySelectorAll('.reveal').forEach(el => {
    if (!el.classList.contains('visible')) revealObserver.observe(el);
  });
}
setupRevealObserver();

// Nav highlight
const navObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting && entry.target.tagName === 'SECTION') {
      const id = entry.target.getAttribute('id');
      document.querySelectorAll('.nav-links a, .mobile-menu a[href^="#"]').forEach(link => {
        link.classList.toggle('active', link.getAttribute('href') === `#${id}`);
      });
    }
  });
}, { threshold: 0.25, rootMargin: '-60px 0px -50% 0px' });
document.querySelectorAll('section[id]').forEach(s => { if (s.id !== 'hero') navObserver.observe(s); });

/* ===== Nav scroll blur + wave parallax ===== */
const navbar = document.getElementById('navbar');
window.addEventListener('scroll', () => {
  navbar.classList.toggle('scrolled', window.scrollY > 50);
  document.getElementById('backToTop').classList.toggle('visible', window.scrollY > window.innerHeight);

  const beach = document.querySelector('.hero-beach');
  if (beach && window.scrollY < window.innerHeight) {
    beach.style.transform = `translateY(${window.scrollY * 0.06}px)`;
  }
});

/* ===== Back to top ===== */
document.getElementById('backToTop').addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* ===== Mobile menu ===== */
const hamburger = document.getElementById('hamburger');
const mobileMenu = document.getElementById('mobileMenu');
const mobileOverlay = document.getElementById('mobileOverlay');
function closeMenu() {
  hamburger.classList.remove('open');
  mobileMenu.classList.remove('open');
  mobileOverlay.classList.remove('open');
  hamburger.setAttribute('aria-expanded', 'false');
  document.body.style.overflow = '';
}
function openMenu() {
  hamburger.classList.add('open');
  mobileMenu.classList.add('open');
  mobileOverlay.classList.add('open');
  hamburger.setAttribute('aria-expanded', 'true');
  document.body.style.overflow = 'hidden';
}
hamburger.addEventListener('click', () => hamburger.classList.contains('open') ? closeMenu() : openMenu());
mobileOverlay.addEventListener('click', closeMenu);
mobileMenu.querySelectorAll('a:not([data-track])').forEach(link => link.addEventListener('click', closeMenu));
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && mobileMenu.classList.contains('open')) closeMenu();
});

/* ===== Init ===== */
function init() {
  document.getElementById('langToggle').textContent = currentLang === 'zh' ? 'EN' : '中文';
  rerenderAll();
  document.getElementById('footerYear').textContent = new Date().getFullYear();
  document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
}
init();
