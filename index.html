<head>

<meta property="og:description" content="语言病理学 · 认知神经科学 · 言语感知(EEG) | Language Pathology · Cognitive Neuroscience · Speech Perception">
<meta property="og:type" content="website">

<meta property="og:locale:alternate" content="en_US">
<meta name="twitter:card" content="summary">
<link rel="alternate" hreflang="zh" href="https://fayhan2002.github.io/">
<link rel="alternate" hreflang="en" href="https://fayhan2002.github.io/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Sans+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<title>Han Fuyi / 韩馥伊</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
<style>
/* ===== CSS Variables ===== */
:root {
  --bg: #F9F6F0;
  --bg-warm: #F5EFE6;
  --text: #1E1B18;
  --text-light: #5C5752;
  --text-muted: #99928B;
  --accent: #5B8C9E;
  --accent-light: #7AACBB;
  --accent-pale: #D6E8EF;
  --card-bg: #FFFFFF;
  --card-border: #E8E1D8;
  --ocean-deep: #0A1628;
  --ocean-dark: #112240;
  --ocean-mid: #1A3550;
  --ocean-teal: #1A4A5A;
  --ocean-light: #216477;
  --sand: #D4C5B2;
  --sand-light: #E8DCD0;
  --sand-pale: #F0E8DE;
  --warm-gold: #B8977E;
  --warm-gold-light: #D4BFA9;
  --shadow: 0 2px 12px rgba(30,27,24,0.05);
  --shadow-hover: 0 12px 40px rgba(30,27,24,0.10);
  --font-zh: 'Noto Serif SC', serif;
  --font-en-heading: 'Playfair Display', serif;
  --font-en-body: 'Source Sans Pro', sans-serif;
  --font-decorative: 'Cormorant Garamond', serif;
  --max-width: 920px;
  --section-gap: 100px;
  --line-height: 1.9;
  --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 17px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: var(--font-en-body); font-weight: 300;
  line-height: var(--line-height); color: var(--text);
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(90,130,150,0.03) 0%, transparent 70%),
    radial-gradient(ellipse at 80% 30%, rgba(180,150,120,0.04) 0%, transparent 60%),
    linear-gradient(rgba(30,27,24,0.008) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 28px 28px;
  transition: opacity 0.25s ease;
  overflow-x: hidden;
}
body.fade-out { opacity: 0; }

h1, h2, h3, h4 { font-weight: 500; line-height: 1.3; }
h2 { font-family: var(--font-en-heading); font-size: 1.8rem; color: var(--text); }
h3 { font-family: var(--font-en-heading); font-size: 1.1rem; }

a { color: var(--accent); text-decoration: none; transition: color var(--transition); }
a:hover { color: var(--ocean-teal); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
img { max-width: 100%; height: auto; display: block; }
::selection { background: var(--accent-pale); color: var(--ocean-dark); }

/* ===== Utility ===== */
.container { max-width: var(--max-width); margin: 0 auto; padding: 0 30px; }
.section-label {
  display: flex; align-items: center; gap: 16px; margin-bottom: 52px;
}
.section-label::before {
  content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); flex-shrink: 0;
}
.section-label::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--card-border), transparent);
}
.section-label span {
  font-family: var(--font-en-heading); font-size: 1.8rem; font-weight: 500;
  color: var(--text); flex-shrink: 0;
}
.section-label span.zh-label {
  font-family: var(--font-zh); font-size: 1.4rem; font-weight: 500;
}

/* ===== Navigation ===== */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  height: 56px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 34px; transition: background 0.4s ease, box-shadow 0.4s ease;
}
.nav.scrolled {
  background: rgba(249,246,240,0.78);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.05);
}
.nav-links { display: flex; align-items: center; gap: 26px; list-style: none; }
.nav-links a {
  font-size: 0.8rem; font-weight: 400; color: var(--text-light);
  text-transform: uppercase; letter-spacing: 0.08em; position: relative;
  transition: color var(--transition);
}
.nav-links a::after {
  content: ''; position: absolute; bottom: -5px; left: 0; right: 0;
  height: 1.5px; background: var(--accent); transform: scaleX(0);
  transition: transform var(--transition); transform-origin: center;
}
.nav-links a:hover, .nav-links a.active { color: var(--accent); }
.nav-links a:hover::after, .nav-links a.active::after { transform: scaleX(1); }
.nav-actions { display: flex; align-items: center; gap: 10px; }

.lang-btn, .track-btn {
  font-family: var(--font-en-body); font-size: 0.76rem;
  border: 1px solid var(--card-border); background: var(--card-bg);
  color: var(--text-light); padding: 5px 14px; border-radius: 20px;
  cursor: pointer; transition: all var(--transition); white-space: nowrap;
}
.lang-btn:hover, .track-btn:hover { border-color: var(--accent); color: var(--accent); }
.track-btn.active {
  background: var(--accent); color: #fff; border-color: var(--accent);
}

.hamburger {
  display: none; flex-direction: column; gap: 5px;
  background: none; border: none; cursor: pointer; padding: 8px; z-index: 1001;
}
.hamburger span {
  display: block; width: 22px; height: 1.5px; background: var(--text);
  transition: transform var(--transition), opacity var(--transition);
}
.hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(4.5px, 4.5px); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(4.5px, -4.5px); }

/* ===== Hero ===== */
.hero {
  position: relative; min-height: 110vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; overflow: hidden; padding: 120px 30px 0;
  background: linear-gradient(180deg,
    var(--bg) 0%,
    var(--sand-pale) 35%,
    var(--sand-light) 55%,
    var(--sand) 70%,
    #C4B8A6 82%,
    var(--ocean-teal) 88%,
    var(--ocean-dark) 100%);
}
.hero-waves {
  position: absolute; bottom: 0; left: 0; width: 100%; height: 62%;
  pointer-events: none; z-index: 0; opacity: 0.92;
}
.hero-waves svg { width: 100%; height: 100%; display: block; }
.wave-layer { transform-origin: center; }
.wave-1 { animation: drift-w1 72s ease-in-out alternate infinite; }
.wave-2 { animation: drift-w2 55s ease-in-out alternate infinite; }
.wave-3 { animation: drift-w3 48s ease-in-out alternate infinite; }
.wave-4 { animation: drift-w4 38s ease-in-out alternate infinite; }
.wave-5 { animation: drift-w5 30s ease-in-out alternate infinite; }
.wave-6 { animation: drift-w6 40s ease-in-out alternate infinite; }

.hero-content { position: relative; z-index: 2; padding-bottom: 100px; }
.hero-photo {
  width: 136px; height: 136px; border-radius: 50%; object-fit: cover;
  border: 2px solid rgba(91,140,158,0.22);
  box-shadow: 0 6px 32px rgba(30,27,24,0.10);
  margin: 0 auto 30px; background: var(--card-bg);
}
.hero h1 {
  font-family: var(--font-zh); font-size: 3rem; font-weight: 500;
  color: var(--text); letter-spacing: 0.05em; margin-bottom: 4px;
}
.hero .en-name {
  font-family: var(--font-decorative); font-size: 1.4rem; font-weight: 400;
  font-style: italic; color: var(--text-light); letter-spacing: 0.1em; margin-bottom: 18px;
}
.hero .motto {
  font-family: var(--font-zh); font-weight: 300; font-size: 1.05rem;
  color: var(--text-muted); letter-spacing: 0.35em; margin-bottom: 36px;
}
.hero-track-toggles { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.hero-track-toggles .track-btn { padding: 9px 26px; font-size: 0.85rem; }

.hero-scroll-hint {
  position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
  z-index: 2; animation: float 3s ease-in-out infinite;
}
.hero-scroll-hint svg { width: 22px; height: 22px; stroke: rgba(255,255,255,0.5); }

/* ===== Sections ===== */
section { padding: var(--section-gap) 0; position: relative; }
section:nth-child(odd) { background: var(--bg); }
section:nth-child(even) { background: var(--bg-warm); }

.reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease, transform 0.8s ease; }
.reveal.visible { opacity: 1; transform: translateY(0); }

/* ===== About ===== */
.about-body { max-width: 700px; margin: 0 auto; }
.about-body p {
  font-family: var(--font-zh); font-size: 1rem; color: var(--text-light);
}
.about-body p + p { margin-top: 1.3em; }

.hobbies-line {
  margin-top: 36px; padding-top: 30px;
  border-top: 1px solid var(--card-border);
  font-family: var(--font-decorative); font-style: italic; font-weight: 400;
  font-size: 0.95rem; color: var(--text-muted);
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 2px;
}
.hobbies-line .hobby {
  cursor: default; transition: all var(--transition); padding: 2px 1px;
}
.hobbies-line .hobby:hover { color: var(--warm-gold); transform: translateY(-2px); }
.hobbies-line .dot { color: var(--sand); margin: 0 5px; }

/* ===== Education Timeline ===== */
.timeline { position: relative; padding-left: 36px; }
.timeline::before {
  content: ''; position: absolute; left: 0; top: 4px; bottom: 4px;
  width: 1px; background: linear-gradient(180deg, var(--accent), var(--card-border), var(--card-border));
}
.timeline-item { position: relative; margin-bottom: 38px; }
.timeline-item:last-child { margin-bottom: 0; }
.timeline-item::before {
  content: ''; position: absolute; left: -40.5px; top: 8px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--accent); border: 2px solid var(--bg);
}
.timeline-item .year {
  font-family: var(--font-decorative); font-size: 0.9rem; font-weight: 600;
  color: var(--accent); letter-spacing: 0.05em; margin-bottom: 4px;
}
.timeline-item .school { font-weight: 500; font-size: 1.08rem; color: var(--text); }
.timeline-item .degree { font-size: 0.9rem; color: var(--text-light); margin-top: 3px; }
.timeline-item .extra { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }

/* ===== Cards ===== */
.cards-grid { display: grid; gap: 22px; }
.card {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: 6px; padding: 30px 32px;
  transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
  position: relative;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover);
  border-color: transparent;
}
.card::before {
  content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
  background: linear-gradient(90deg, var(--accent), transparent);
  transform: scaleX(0); transform-origin: left;
  transition: transform var(--transition); border-radius: 6px 6px 0 0;
}
.card:hover::before { transform: scaleX(1); }

.card h3 { margin-bottom: 8px; font-size: 1.05rem; color: var(--text); line-height: 1.45; }
.card .meta {
  font-size: 0.82rem; color: var(--accent); font-weight: 400;
  letter-spacing: 0.03em; margin-bottom: 10px;
}
.card .desc { font-size: 0.9rem; color: var(--text-light); line-height: 1.7; }
.card .authors { font-size: 0.78rem; color: var(--text-muted); font-style: italic; margin-bottom: 4px; }

.card.academic-card { border-left: 3px solid var(--accent); padding-left: 29px; }
.card.industry-card { border-left: 3px solid var(--warm-gold); padding-left: 29px; }

/* ===== Section visibility by track mode ===== */
.dynamic-section { transition: opacity 0.4s ease, max-height 0.4s ease; overflow: hidden; }
.dynamic-section.hidden { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; margin: 0; pointer-events: none; }

/* ===== Skills ===== */
.skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 20px; }
.skill-cat {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: 6px; padding: 26px; transition: transform var(--transition), box-shadow var(--transition);
}
.skill-cat:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.skill-cat h4 {
  font-family: var(--font-decorative); font-size: 1rem; font-weight: 600;
  color: var(--accent); margin-bottom: 14px; letter-spacing: 0.05em;
}
.skill-tags { display: flex; flex-wrap: wrap; gap: 7px; }
.skill-tag {
  font-size: 0.77rem; padding: 4px 13px; border-radius: 14px;
  background: var(--accent-pale); color: var(--accent);
  transition: all var(--transition); cursor: default;
}
.skill-tag:hover { background: var(--accent); color: #fff; transform: translateY(-1px); }

/* ===== Contact ===== */
.contact-links { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; }
.contact-link {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 24px; border: 1px solid var(--card-border);
  border-radius: 30px; font-size: 0.9rem; color: var(--text-light);
  transition: all var(--transition); background: var(--card-bg);
}
.contact-link:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
.contact-link svg { width: 18px; height: 18px; flex-shrink: 0; }

/* ===== Footer ===== */
footer {
  text-align: center; padding: 44px 30px;
  font-size: 0.78rem; color: var(--text-muted);
  border-top: 1px solid var(--card-border); background: var(--bg);
}
footer a { color: var(--text-muted); }
footer a:hover { color: var(--accent); }

/* ===== Back to Top ===== */
.back-to-top {
  position: fixed; bottom: 30px; right: 30px; z-index: 999;
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--card-bg); border: 1px solid var(--card-border);
  box-shadow: var(--shadow); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transform: translateY(12px); pointer-events: none;
  transition: opacity var(--transition), transform var(--transition), border-color var(--transition);
}
.back-to-top.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
.back-to-top:hover { border-color: var(--accent); transform: translateY(-2px); }
.back-to-top svg { width: 16px; height: 16px; stroke: var(--text-light); }

/* ===== Mobile Menu ===== */
.mobile-menu {
  position: fixed; top: 0; right: 0; bottom: 0; width: 270px;
  background: var(--bg); z-index: 999;
  box-shadow: -6px 0 28px rgba(30,27,24,0.10);
  transform: translateX(100%); transition: transform 0.4s ease;
  display: flex; flex-direction: column; padding: 80px 34px 34px;
}
.mobile-menu.open { transform: translateX(0); }
.mobile-menu a {
  display: block; padding: 13px 0; font-size: 0.95rem;
  color: var(--text); border-bottom: 1px solid var(--card-border);
}
.mobile-menu .mobile-actions { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 10px; }
.mobile-overlay {
  position: fixed; inset: 0; background: rgba(10,22,40,0.3); z-index: 998;
  opacity: 0; pointer-events: none; transition: opacity var(--transition);
}
.mobile-overlay.open { opacity: 1; pointer-events: auto; }

/* ===== Sand Transition ===== */
.sand-transition {
  height: 120px; margin-top: -2px;
  background: linear-gradient(180deg, var(--sand) 0%, var(--sand-light) 40%, var(--bg) 100%);
  position: relative; z-index: 1;
}

/* ===== Animations ===== */
@keyframes drift-w1 {
  0% { transform: translateX(0) translateY(0); }
  50% { transform: translateX(-3%) translateY(4px); }
  100% { transform: translateX(-6%) translateY(0); }
}
@keyframes drift-w2 {
  0% { transform: translateX(-2%) translateY(0); }
  50% { transform: translateX(2%) translateY(-3px); }
  100% { transform: translateX(-4%) translateY(0); }
}
@keyframes drift-w3 {
  0% { transform: translateX(0) translateY(0); }
  50% { transform: translateX(4%) translateY(5px); }
  100% { transform: translateX(-3%) translateY(0); }
}
@keyframes drift-w4 {
  0% { transform: translateX(-1%) translateY(0); }
  50% { transform: translateX(-5%) translateY(-4px); }
  100% { transform: translateX(3%) translateY(0); }
}
@keyframes drift-w5 {
  0% { transform: translateX(2%) translateY(0); }
  50% { transform: translateX(-3%) translateY(3px); }
  100% { transform: translateX(5%) translateY(0); }
}
@keyframes drift-w6 {
  0% { transform: translateX(0) translateY(0); }
  50% { transform: translateX(4%) translateY(-2px); }
  100% { transform: translateX(-3%) translateY(0); }
}
@keyframes float {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-10px); }
}

/* ===== Responsive: 768px ===== */
@media (max-width: 768px) {
  :root { --section-gap: 64px; }
  html { font-size: 15px; }
  .nav-links { display: none; }
  .hamburger { display: flex; }
  .hero { min-height: 100vh; padding: 100px 20px 0; }
  .hero h1 { font-size: 2.4rem; }
  .hero .en-name { font-size: 1.15rem; }
  .hero-photo { width: 116px; height: 116px; }
  .hero-waves { height: 52%; }
  .hero-scroll-hint { bottom: 60px; }
  .sand-transition { height: 80px; }
  .container { padding: 0 22px; }
  .skills-grid { grid-template-columns: 1fr 1fr; }
  .card { padding: 22px 20px; }
  .timeline { padding-left: 28px; }
  .timeline-item::before { left: -32.5px; width: 8px; height: 8px; }
}

/* ===== Responsive: 480px ===== */
@media (max-width: 480px) {
  .hero h1 { font-size: 1.9rem; }
  .hero .en-name { font-size: 1rem; }
  .hero .motto { font-size: 0.9rem; letter-spacing: 0.22em; }
  .hero-photo { width: 104px; height: 104px; }
  .hero-track-toggles { gap: 8px; }
  .hero-track-toggles .track-btn { padding: 7px 18px; font-size: 0.78rem; }
  .hero-content { padding-bottom: 70px; }
  .skills-grid { grid-template-columns: 1fr; }
  .cards-grid { gap: 14px; }
  .section-label span { font-size: 1.4rem; }
  .section-label span.zh-label { font-size: 1.15rem; }
  .contact-links { flex-direction: column; align-items: center; }
  .hobbies-line { font-size: 0.85rem; }
}

/* ===== Print ===== */
@media print {
  .nav, .hero-waves, .hero-scroll-hint, .hero-track-toggles,
  .hamburger, .mobile-menu, .mobile-overlay, .back-to-top,
  .contact-link, footer, .sand-transition { display: none !important; }
  body { background: #fff; color: #000; font-size: 11pt; }
  .hero { min-height: auto; padding: 20px 0; background: none; }
  .hero-photo { width: 90px; height: 90px; }
  .hero h1 { font-size: 1.4rem; }
  section { padding: 16px 0; break-inside: avoid; }
  .card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
  .card:hover, .card:hover::before { transform: none; }
  .reveal { opacity: 1; transform: none; }
  a { color: #000; }
  .timeline::before { background: #ccc; }
  .dynamic-section.hidden { opacity: 1; max-height: none; display: block; }
}

/* ===== Reduced Motion ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  html { scroll-behavior: auto; }
}
</style>
</head>
<body>

<!-- ===== Navigation ===== -->
<header class="nav" id="navbar">
  <a href="#hero" style="font-family:var(--font-decorative);font-weight:500;font-size:1.05rem;color:var(--text);letter-spacing:0.06em;font-style:italic;">Han Fuyi</a>
  <nav aria-label="Main navigation">
    <ul class="nav-links" id="navLinks">
      <li><a href="#about" data-i18n="nav.about">关于</a></li>
      <li><a href="#education" data-i18n="nav.education">教育</a></li>
      <li><a href="#research" data-i18n="nav.research">科研</a></li>
      <li><a href="#projects" data-i18n="nav.projects">项目</a></li>
      <li><a href="#skills" data-i18n="nav.skills">技能</a></li>
      <li><a href="#contact" data-i18n="nav.contact">联系</a></li>
    </ul>
  </nav>

/* ===== State ===== */
let currentLang = localStorage.getItem('lang') || 'zh';
let currentTrack = localStorage.getItem('track') || '';

/* ===== Render helpers ===== */
function renderTimeline(lang) {
  const d = I18N[lang].education;
  document.getElementById('eduTimeline').innerHTML = d.items.map(item =>
    `<div class="timeline-item">
      <div class="year">${item.year}</div>
      <div class="school">${item.school}</div>
      <div class="degree">${item.degree}</div>
      ${item.extra ? `<div class="extra">${item.extra}</div>` : ''}
    </div>`
  ).join('');
}

function renderResearch(lang) {
  const items = I18N[lang].research.items;
  document.getElementById('researchGrid').innerHTML = items.map(item =>
    `<article class="card academic-card">
      <p class="authors">${item.authors}</p>
      <h3>${item.title}</h3>
      <p class="meta">${item.meta}</p>
      <p class="desc">${item.desc}</p>
    </article>`
  ).join('');
  const noteEl = document.querySelector('#research + p') || document.querySelector('#research ~ p');
  const note = I18N[lang].research.note;
  const el = document.querySelector('#research').querySelector('[data-i18n="research.note"]');
  if (el) el.textContent = note;
}

function renderProjects(lang, track) {
  const section = document.getElementById('projects');
  const grid = document.getElementById('projectsGrid');
  const titleEl = document.getElementById('projectsTitle');
  let data;

  if (track === 'academic') {
    data = I18N[lang].academicProjects;
  } else if (track === 'industry') {
    data = I18N[lang].industryProjects;
  } else {
    // Default: show all academic projects
    data = I18N[lang].academicProjects;
  }

  titleEl.textContent = data.title;
  titleEl.className = 'zh-label';

  grid.innerHTML = data.items.map(item =>
    `<article class="card ${item.cls || ''}">
      <h3>${item.title}</h3>
      <p class="meta">${item.meta}</p>
      <p class="desc">${item.desc}</p>
    </article>`
  ).join('');
}

function renderInternship(lang) {
  const data = I18N[lang].internship;
  document.getElementById('internshipTitle').textContent = data.title;
  document.getElementById('internshipGrid').innerHTML = data.items.map(item =>
    `<article class="card ${item.cls || ''}">
      <h3>${item.title}</h3>
      <p class="meta">${item.meta}</p>

}

function toggleInternship(visible) {
  const section = document.getElementById('internship');
  if (visible) {
    section.classList.remove('hidden');
  } else {

}

/* ===== Full re-render (language change) ===== */
function rerenderAll() {
  renderTimeline(currentLang);
  renderResearch(currentLang);
  renderSkills(currentLang);
  renderContact(currentLang);
  applyTrackMode();
}

/* ===== Language Switch ===== */
function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('lang', lang);
  document.body.classList.add('fade-out');
  setTimeout(() => {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const path = el.getAttribute('data-i18n');
      const val = path.split('.').reduce((o, k) => o?.[k], I18N[lang]);
      if (val !== undefined && typeof val === 'string') {
        if (path === 'about.hobbies' || path === 'research.note') {
          el.innerHTML = val;
        } else {
          el.textContent = val;
        }
      }
    });
    rerenderAll();
    document.getElementById('langToggle').textContent = lang === 'zh' ? 'EN' : '中文';
    document.getElementById('langToggle').setAttribute('aria-label', lang === 'zh' ? 'Switch to English' : '切换到中文');
    document.title = lang === 'zh' ? '韩馥伊 / Han Fuyi' : 'Han Fuyi / 韩馥伊';
    document.body.classList.remove('fade-out');
  }, 200);
}

document.getElementById('langToggle').addEventListener('click', () => {
  setLang(currentLang === 'zh' ? 'en' : 'zh');
});

/* ===== Track Mode ===== */
function setTrack(track) {
  if (currentTrack === track) {
    currentTrack = '';
    localStorage.removeItem('track');
  } else {
    currentTrack = track;
    localStorage.setItem('track', track);
  }
  applyTrackMode();
}

function applyTrackMode() {
  document.body.classList.remove('mode-academic', 'mode-industry');
  if (currentTrack === 'academic') document.body.classList.add('mode-academic');
  if (currentTrack === 'industry') document.body.classList.add('mode-industry');

  document.querySelectorAll('.track-btn[data-track]').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-track') === currentTrack);
  });

  // Render projects based on track
  renderProjects(currentLang, currentTrack);

  // Internship: visible in industry mode or default mode, hidden in academic mode
  toggleInternship(currentTrack !== 'academic');
  if (currentTrack !== 'academic') {
    renderInternship(currentLang);
  }

  // Re-observe reveal elements
  refreshRevealObservers();
}

document.querySelectorAll('.track-btn[data-track]').forEach(btn => {
  btn.addEventListener('click', () => setTrack(btn.getAttribute('data-track')));
});

/* ===== IntersectionObserver ===== */
let revealObserver;

function setupRevealObserver() {
  revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.target.classList.contains('reveal') && entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
}

function refreshRevealObservers() {
  if (revealObserver) revealObserver.disconnect();
  setupRevealObserver();
  document.querySelectorAll('.reveal').forEach(el => {
    if (!el.classList.contains('visible')) revealObserver.observe(el);
  });
}

setupRevealObserver();

/* ===== Nav highlight observer ===== */
const navObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting && entry.target.tagName === 'SECTION') {
      const id = entry.target.getAttribute('id');
      document.querySelectorAll('.nav-links a, .mobile-menu a[href^="#"]').forEach(link => {
        link.classList.toggle('active', link.getAttribute('href') === `#${id}`);
      });
    }
  });
}, { threshold: 0.25, rootMargin: '-60px 0px -50% 0px' });

document.querySelectorAll('section[id]').forEach(s => {
  if (s.id !== 'hero') navObserver.observe(s);
});

/* ===== Nav scroll blur ===== */
const navbar = document.getElementById('navbar');
window.addEventListener('scroll', () => {
  const scrolled = window.scrollY > 50;
  navbar.classList.toggle('scrolled', scrolled);
  document.getElementById('backToTop').classList.toggle('visible', window.scrollY > window.innerHeight);

  // Parallax effect on waves
  const hero = document.querySelector('.hero');
  if (hero) {
    const scrollPos = window.scrollY;
    const waves = document.querySelector('.hero-waves');
    if (waves && scrollPos < window.innerHeight) {
      waves.style.transform = `translateY(${scrollPos * 0.15}px)`;
    }
  }
});

/* ===== Back to top ===== */
document.getElementById('backToTop').addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* ===== Mobile menu ===== */
const hamburger = document.getElementById('hamburger');
const mobileMenu = document.getElementById('mobileMenu');
const mobileOverlay = document.getElementById('mobileOverlay');

function closeMenu() {
  hamburger.classList.remove('open');
  mobileMenu.classList.remove('open');
  mobileOverlay.classList.remove('open');
  hamburger.setAttribute('aria-expanded', 'false');
  document.body.style.overflow = '';
}
function openMenu() {
  hamburger.classList.add('open');
  mobileMenu.classList.add('open');
  mobileOverlay.classList.add('open');
  hamburger.setAttribute('aria-expanded', 'true');
  document.body.style.overflow = 'hidden';
}
hamburger.addEventListener('click', () => {
  hamburger.classList.contains('open') ? closeMenu() : openMenu();
});
mobileOverlay.addEventListener('click', closeMenu);
mobileMenu.querySelectorAll('a:not([data-track])').forEach(link => {
  link.addEventListener('click', closeMenu);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && mobileMenu.classList.contains('open')) closeMenu();
});

/* ===== Init ===== */
function init() {
  document.getElementById('langToggle').textContent = currentLang === 'zh' ? 'EN' : '中文';
  rerenderAll();
  if (currentTrack) applyTrackMode();
  document.getElementById('footerYear').textContent = new Date().getFullYear();
  // Initial reveal observation
  document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
}
init();
</script>
